<style>

    --s-actual: #3987e5; --s-plan: #9aa29e; --s-cons: #d95926; --s-slow: #199e70; --s-target: #eef1ef;
  }
}
:root[data-theme="dark"] {

  --bg: #111413; --surface: #1a1e1c; --surface-2: #222826; --border: #2e3532;
  --text: #eef1ef; --text-2: #c2c9c5; --muted: #98a19c;
  --brand: #38a8c4; --brand-ink: #071417; --brand-soft: #16323a;
  --good: #4ade80; --good-soft: #14281c; --warn: #f5b041; --warn-soft: #2e2412; --bad: #f87171; --bad-soft: #321718;

* { box-sizing: border-box; }
html, body { margin: 0; }
body {

}
.hidden { display: none !important; }

.small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }

.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; }

.view { max-width: 640px; margin: 0 auto; padding: 16px; outline: none; }
h1 { font-size: 21px; margin: 4px 0 12px; } h2 { font-size: 17px; margin: 0 0 10px; } h3 { font-size: 15px; margin: 14px 0 6px; }
p { margin: 6px 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }

.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.w-0{width:0}.w-5{width:5%}.w-10{width:10%}.w-15{width:15%}.w-20{width:20%}.w-25{width:25%}.w-30{width:30%}.w-35{width:35%}.w-40{width:40%}.w-45{width:45%}.w-50{width:50%}.w-55{width:55%}.w-60{width:60%}.w-65{width:65%}.w-70{width:70%}.w-75{width:75%}.w-80{width:80%}.w-85{width:85%}.w-90{width:90%}.w-95{width:95%}.w-100{width:100%}

label { display: block; font-weight: 500; font-size: 14px; margin: 10px 0 4px; }
label .opt { color: var(--muted); font-weight: 400; font-size: 12.5px; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

.field-error { color: var(--bad); font-size: 13px; margin-top: 3px; }

.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
.check input { width: 20px; min-height: 20px; margin-top: 3px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; }

button, .btn {
  font: inherit; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button.primary, .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
button.ghost { background: transparent; }

button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--text); }

.actions { display: flex; gap: 10px; margin-top: 16px; }

.notice { border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; border: 1px solid; }
.notice.warn { background: var(--warn-soft); border-color: var(--warn); }
.notice.bad { background: var(--bad-soft); border-color: var(--bad); }
.notice.good { background: var(--good-soft); border-color: var(--good); }

.notice ul { margin: 4px 0; padding-inline-start: 18px; }
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.badge.warn { background: var(--warn-soft); border-color: var(--warn); }
.badge.good { background: var(--good-soft); border-color: var(--good); }

.steps { display: flex; gap: 6px; margin-bottom: 14px; }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: start; vertical-align: top; }

.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }

.legend i.dash { border-top-style: dashed; }
.lg-actual { border-color: var(--s-actual); } .lg-plan { border-color: var(--s-plan); } .lg-cons { border-color: var(--s-cons); } .lg-slow { border-color: var(--s-slow); } .lg-target { border-color: var(--s-target); }

  font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; transform: translate(-50%, -110%); }
.svg-grid { stroke: var(--border); } .svg-axis { fill: var(--muted); font-size: 11px; }
.svg-actual { stroke: var(--s-actual); } .svg-actual-dot { fill: var(--s-actual); stroke: var(--surface); stroke-width: 2; }
.svg-plan { stroke: var(--s-plan); } .svg-cons { stroke: var(--s-cons); } .svg-slow { stroke: var(--s-slow); } .svg-target { stroke: var(--s-target); }
.svg-label { font-size: 11px; fill: var(--text-2); } .svg-cross { stroke: var(--muted); }

.tabs { position: fixed; bottom: 0; inset-inline: 0; z-index: 6; display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; flex-direction: column; gap: 2px; padding: 8px 2px; font-size: 12px; font-weight: 500; color: var(--muted); min-height: 60px; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }

.list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.scale button { padding: 8px 0; min-height: 40px; }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }

@media (min-width: 560px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.spread.wrap { flex-wrap: wrap; }
.items { margin-top: 6px; }

.recipe-search { margin: 10px 0; }

.recipe-title { font-weight: 600; }

/* nutrition sub-tabs, weekly plan, preferences */
.subtabs, .daychips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 14px; padding-bottom: 2px; }
.subtabs button { flex: 0 0 auto; white-space: nowrap; min-height: 40px; padding: 6px 14px; border-radius: 99px; font-size: 14px; }

.meal-title { font-weight: 600; margin: 2px 0; }

// Calendar-correct date helpers. All dates are handled as UTC calendar days
// ("YYYY-MM-DD") so time zones and DST never shift a day.

const ISO_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
const DAY_MS = 86400000;

function parseDate(s) {
  if (s instanceof Date) return new Date(Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate()));
  const m = ISO_RE.exec(String(s || ''));
  if (!m) return null;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  // Reject impossible dates such as 2026-02-30
  if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
  return d;
}

function fmt(d) {
  return d.toISOString().slice(0, 10);
}

function addDays(dateStr, days) {
  const d = parseDate(dateStr);
  return fmt(new Date(d.getTime() + Math.round(days) * DAY_MS));
}

function diffDays(fromStr, toStr) {
  return Math.round((parseDate(toStr) - parseDate(fromStr)) / DAY_MS);
}

function daysInMonth(y, m) {
  return new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
}

// Whole calendar months + remaining days between two dates (respects month lengths).
function monthsAndDays(fromStr, toStr) {
  const a = parseDate(fromStr);
  const b = parseDate(toStr);
  if (b < a) return { months: 0, days: 0 };
  let months = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
  const anchor = () => {
    const y = a.getUTCFullYear() + Math.floor((a.getUTCMonth() + months) / 12);
    const mo = (a.getUTCMonth() + months) % 12;
    const day = Math.min(a.getUTCDate(), daysInMonth(y, mo));
    return new Date(Date.UTC(y, mo, day));
  };
  let an = anchor();
  if (an > b) { months -= 1; an = anchor(); }
  return { months, days: Math.round((b - an) / DAY_MS) };
}

// Same day-of-month n months later (clamped to the month's last day): 2026-01-31 + 1 → 2026-02-28.
function addMonths(dateStr, n) {
  const a = parseDate(dateStr);
  const total = a.getUTCMonth() + n;
  const y = a.getUTCFullYear() + Math.floor(total / 12);
  const mo = ((total % 12) + 12) % 12;
  return fmt(new Date(Date.UTC(y, mo, Math.min(a.getUTCDate(), daysInMonth(y, mo)))));
}

module.exports = { parseDate, fmt, addDays, addMonths, diffDays, monthsAndDays, DAY_MS };

      from: addDays(goal.startDate, week * 7),
      to: addDays(goal.startDate, week * 7 + 6),
      avgWeight,
      weighIns: a ? a.weighIns : 0,
      lowWeighInCount: a ? a.weighIns < 3 : true,
      changeVsPrev: avgWeight != null && prev?.avgWeight != null ? round(avgWeight - prev.avgWeight, 2) : null,
      changeSinceStart: avgWeight != null ? round(avgWeight - goal.startWeight, 2) : null,
      goalProgressPct: avgWeight != null ? round(Math.max(0, Math.min(100, (((goal.startWeight - avgWeight) * sign) / totalToLose) * 100)), 1) : null,
      waistCm: c.waistCm ?? null,

  if (goal.targetWeight > goal.startWeight) {

function trendSlope(rows, lastN = 4) {
  const pts = rows.filter((r) => r.avgWeight != null).slice(-lastN);

  const n = pts.length;
  const mx = pts.reduce((s, r) => s + r.week, 0) / n;
  const my = pts.reduce((s, r) => s + r.avgWeight, 0) / n;

}

14: function(module, exports, __req){
'use strict';
const { round } = __req(3);
const { parseDate } = __req(2);

// Hydration & sweat-rate module.
// Sources (see src/data/references.json):
//  - broad2019 ch.3: keep the fluid deficit below 2 % of body mass; rehydrate ≈125–150 % of the deficit
//    with sodium-containing fluids/food; over-drinking with low sweat rates risks hyponatraemia.
//  - broad2019 ch.5, Fig 5.1: weight loss + dark urine + thirst — two indicators "likely", three "very likely".
//  - barclay2012 ch.2: swimmers don't notice sweating; sports drink 4–8 g CHO/100 mL, 500–700 mg/L sodium.
// The sweat-rate formula is the standard mass-balance:  (pre − post + fluid in − urine out) / hours,
// assuming 1 kg body mass ≈ 1 L sweat (approximation; ignores respiratory/substrate mass losses).

const LIMITS = { minMin: 10, maxMin: 360, maxDeltaKg: 5, maxRateLph: 4 };

function validateSession(b = {}, { today = null } = {}) {
  const errors = {};
  const n = (k) => (b[k] === '' || b[k] == null ? null : Number(b[k]));
  const v = {
    date: typeof b.date === 'string' && parseDate(b.date) ? b.date : null,
    preKg: n('preKg'), postKg: n('postKg'), fluidL: n('fluidL') ?? 0, urineL: n('urineL') ?? 0,
    durationMin: n('durationMin'), environment: ['pool_indoor', 'pool_outdoor', 'open_water', 'land_hot', 'land_mild'].includes(b.environment) ? b.environment : 'pool_indoor',
    note: b.note ? String(b.note).slice(0, 200) : null,
  };
  if (!v.date) errors.date = 'التاريخ مطلوب وصحيح (YYYY-MM-DD).';
  else if (today && v.date > today) errors.date = 'ما ينفعش تسجل حصة بتاريخ لسه ما جاش.';
  for (const [k, lab] of [['preKg', 'الوزن قبل'], ['postKg', 'الوزن بعد']]) {
    if (!(v[k] >= 30 && v[k] <= 250)) errors[k] = `${lab} يجب أن يكون بين 30 و250 كجم.`;
  }
  if (!(v.durationMin >= LIMITS.minMin && v.durationMin <= LIMITS.maxMin)) errors.durationMin = `مدة الحصة بين ${LIMITS.minMin} و${LIMITS.maxMin} دقيقة.`;
  if (!(v.fluidL >= 0 && v.fluidL <= 6)) errors.fluidL = 'السوائل المشروبة بين 0 و6 لتر.';
  if (!(v.urineL >= 0 && v.urineL <= 3)) errors.urineL = 'كمية البول بين 0 و3 لتر.';
  if (!errors.preKg && !errors.postKg && Math.abs(v.preKg - v.postKg) > LIMITS.maxDeltaKg) errors.postKg = 'الفرق بين الوزن قبل وبعد غير منطقي؛ راجع القياس.';
  if (!Object.keys(errors).length) {
    const r = sweatRate(v);
    if (r.sweatRateLph > LIMITS.maxRateLph) errors.fluidL = 'معدل التعرق الناتج أعلى من 4 لتر/ساعة؛ غالبًا في خطأ في الإدخال.';
    if (r.sweatLossL < 0) errors.postKg = 'النتيجة تعطي عرقًا سالبًا؛ راجع الوزن والسوائل والبول.';
  }
  return { value: v, errors };
}

function sweatRate({ preKg, postKg, fluidL = 0, urineL = 0, durationMin }) {
  const hours = durationMin / 60;
  const sweatLossL = preKg - postKg + fluidL - urineL;
  const changeKg = postKg - preKg;
  const changePct = (changeKg / preKg) * 100;
  return {
    sweatLossL: round(sweatLossL, 2),
    sweatRateLph: round(sweatLossL / hours, 2),
    bodyMassChangeKg: round(changeKg, 2),
    bodyMassChangePct: round(changePct, 2),
    replacedPct: sweatLossL > 0 ? Math.round((fluidL / sweatLossL) * 100) : null,
  };
}

// Interprets one session. Returns flags + advice; never a diagnosis.
function assessSession(s) {
  const r = sweatRate(s);
  const flags = [];
  const advice = [];
  const deficitKg = Math.max(0, -r.bodyMassChangeKg);
  if (r.bodyMassChangePct <= -2) {
    flags.push({ code: 'LOSS_OVER_2PCT', level: 'warn', text: `خسرت ${Math.abs(r.bodyMassChangePct)}% من وزنك في الحصة (2% أو أكتر) — ده بيأثر على الأداء.` });
  } else if (r.bodyMassChangePct < -1) {
    flags.push({ code: 'LOSS_1_2PCT', level: 'info', text: `خسرت ${Math.abs(r.bodyMassChangePct)}% من وزنك في الحصة؛ حاول تشرب أكتر شوية أثناء الحصة الجاية.` });
  }
  if (r.bodyMassChangeKg > 0) {
    flags.push({ code: 'GAINED_WEIGHT', level: 'warn', text: 'وزنك زاد بعد الحصة: شربت أكتر من اللي عرقته. الإفراط في الشرب ممكن يكون خطر (نقص الصوديوم في الدم)؛ اشرب على قد احتياجك.' });
  }
  if (deficitKg > 0) {
    advice.push(`بعد الحصة: اشرب حوالي ${round(deficitKg * 1.25, 1)}–${round(deficitKg * 1.5, 1)} لتر على مدار الساعات الجاية (125–150% من الفاقد)، ويفضل مع أكل أو مشروب فيه ملح (لبن، مشروب رياضي، وجبة).`);
  }
  // App rule (derived, not from a reference): to stay under a 2 % loss next time, drink between
  // (expected sweat − 2 % body mass) and the expected sweat — never more than the sweat itself.
  const h = s.durationMin / 60;
  const expected = r.sweatRateLph * h;
  const lo = Math.max(0, expected - 0.02 * s.preKg);
  if (expected > 0) {
    advice.push(`في حصة بنفس المدة والظروف: اشرب من ${round(lo, 1)} إلى ${round(expected, 1)} لتر أثناءها (ما تزودش عن العرق نفسه).`);
  }
  if (s.durationMin > 60) advice.push('الحصة أطول من ساعة: مشروب رياضي (4–8 جم كربوهيدرات لكل 100 مل، وصوديوم 500–700 ملجم/لتر) أو سناك كربوهيدرات مفيد، واشطف بقّك بمية بعده.');
  else advice.push('الحصة أقل من ساعة: المية كفاية غالبًا.');
  return { ...r, flags, advice, method: 'mass-balance: (قبل − بعد + سوائل − بول) ÷ الساعات؛ 1 كجم ≈ 1 لتر' };
}

// Weight / Urine / Thirst likelihood (broad2019, Fig 5.1).
function wutCheck({ weightDown, urineDark, thirsty }) {
  const n = [weightDown, urineDark, thirsty].filter(Boolean).length;
  const level = n >= 3 ? 'very_likely' : n === 2 ? 'likely' : n === 1 ? 'possible' : 'unlikely';
  const text = {
    very_likely: 'الجفاف مرجّح جدًا: اشرب بانتظام النهارده ومع الوجبات، وراجع لون البول.',
    likely: 'الجفاف مرجّح: زوّد السوائل على مدار اليوم ومع الوجبات.',
    possible: 'مؤشر واحد فقط؛ تابع بكرة الصبح.',
    unlikely: 'لا توجد مؤشرات جفاف.',
  }[level];
  return { count: n, level, text };
}

function summarize(sessions) {
  if (!sessions.length) return null;
  const rates = sessions.map((s) => sweatRate(s).sweatRateLph);
  const recent = rates.slice(-5);
  return {
    sessions: sessions.length,
    avgSweatRateLph: round(recent.reduce((a, b) => a + b, 0) / recent.length, 2),
    minLph: Math.min(...recent), maxLph: Math.max(...recent),
    basedOnLast: recent.length,
  };
}

module.exports = { validateSession, sweatRate, assessSession, wutCheck, summarize, LIMITS };

},

16: function(module, exports, __req){
'use strict';
// Academies, roles and the data-access policy. Everything here runs on the server (the demo runs the
// same file in the browser); the UI only displays what these functions return.
//
// Principles:
//  - Isolation: a user only sees an academy they belong to, and only athletes who are members of
//    that same academy. Every check is (actor, academy, target) — never trusting ids from the client.
//  - Least data: each role gets a fixed set of fields (ROLE_VIEWS). Health data (weights, targets,
//    screening, hydration logs) is visible to a dietitian ONLY after the athlete (or, for a minor,
//    a linked parent) turns sharing on. Coaches and admins never receive weights or screening answers.
//  - Minors (< 18 by the athlete's goal): only a linked parent can turn health sharing on.
//  - The audit log records who did what to whom — never the health data itself.
// These rules are design decisions for review by the academy and a qualified professional.

const service = __req(17);
const pro = __req(26);

const ROLES = ['admin', 'coach', 'dietitian', 'athlete', 'parent'];
const ROLE_AR = { admin: 'مدير الأكاديمية', coach: 'مدرب', dietitian: 'أخصائي تغذية', athlete: 'لاعب', parent: 'ولي أمر' };
const STAFF = ['admin', 'coach', 'dietitian'];
const CAN_INVITE = { admin: ROLES, coach: ['athlete', 'parent'], dietitian: [], athlete: [], parent: [] };
const INVITE_DAYS = 7;

const err = (code, status, message) => ({ error: code, status, message });
const NOT_FOUND = () => err('NOT_FOUND', 404, 'غير موجود.');

function cleanName(v) {
  const s = String(v ?? '').replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 60);
  return s || null;
}

// ---------- academies & membership ----------
function createAcademy(db, userId, body) {
  const name = cleanName(body.name);
  if (!name || name.length < 2) return err('VALIDATION', 400, 'اكتب اسم الأكاديمية.');
  const id = db.createAcademy(name, userId, cleanName(body.displayName));
  db.audit(id, userId, 'academy_create', null);
  return { academy: db.academy(id), memberships: db.membershipsOf(userId) };
}

function myAcademies(db, userId) {
  const list = db.membershipsOf(userId);
  const byId = new Map();
  for (const m of list) {
    const a = byId.get(m.academyId) || { id: m.academyId, name: m.name, roles: [], displayName: m.displayName };
    a.roles.push(m.role);
    byId.set(m.academyId, a);
  }
  const out = [...byId.values()].map((a) => {
    const extra = {};
    if (a.roles.includes('athlete')) {
      extra.sharing = db.getSharing(a.id, userId);
      extra.sharingControl = sharingControl(db, a.id, userId);
      extra.guardians = db.guardiansOf(a.id, userId).length;
      extra.minorConsent = minorConsentState(db, userId);
    }
    extra.kind = (db.academy(a.id) || {}).kind || 'academy';
    if (a.roles.includes('parent')) extra.children = db.childrenOf(a.id, userId).map((id) => childCard(db, a.id, id));
    return { ...a, rolesAr: a.roles.map((r) => ROLE_AR[r]), canInvite: [...new Set(a.roles.flatMap((r) => CAN_INVITE[r]))], isStaff: a.roles.some((r) => STAFF.includes(r)), ...extra };
  });
  return { academies: out, roles: ROLE_AR };
}

function requireMember(db, userId, academyId) {
  const roles = db.rolesIn(userId, academyId);
  if (!roles.length || !db.academy(academyId)) return { fail: NOT_FOUND() }; // don't reveal other academies exist
  return { roles };
}

function createInvite(db, userId, academyId, body, deps) {
  const { roles, fail } = requireMember(db, userId, academyId);
  if (fail) return fail;
  const role = body.role;
  if (!ROLES.includes(role)) return err('VALIDATION', 400, 'دور غير صحيح.');
  if (!roles.some((r) => CAN_INVITE[r].includes(role))) return err('FORBIDDEN', 403, 'دورك مش مسموحله يدعو بالدور ده.');
  let athleteId = null;
  if (role === 'parent') {
    athleteId = Number(body.athleteId);
    if (!Number.isInteger(athleteId) || !db.rolesIn(athleteId, academyId).includes('athlete')) return err('VALIDATION', 400, 'دعوة ولي الأمر لازم تكون مربوطة بلاعب في نفس الأكاديمية.');
  }
  const code = deps.randomCode();
  db.createInvite(deps.hash(code), academyId, role, userId, deps.nowMs() + INVITE_DAYS * 86400000, athleteId);
  db.audit(academyId, userId, `invite_create:${role}`, athleteId);
  return { code, role, roleAr: ROLE_AR[role], expiresInDays: INVITE_DAYS, note: 'الكود بيظهر مرة واحدة بس، وبيشتغل مرة واحدة خلال 7 أيام.' };
}

function acceptInvite(db, userId, body, deps) {
  const code = String(body.code || '').trim().toUpperCase();
  if (!/^[A-Z0-9-]{6,20}$/.test(code)) return err('VALIDATION', 400, 'الكود غير صحيح.');
  const inv = db.inviteByHash(deps.hash(code));
  if (!inv || inv.used_by != null || inv.expires_at < deps.nowMs()) return err('INVALID_INVITE', 400, 'الكود غير صحيح أو مستخدم أو منتهي.');
  if (inv.role === 'parent' && inv.athlete_id === userId) return err('VALIDATION', 400, 'اللاعب ما ينفعش يبقى ولي أمر نفسه.');
  if (!db.useInvite(deps.hash(code), userId)) return err('INVALID_INVITE', 400, 'الكود اتستخدم.');
  db.addMembership(inv.academy_id, userId, inv.role, cleanName(body.displayName));
  if (inv.role === 'parent') db.linkGuardian(inv.academy_id, userId, inv.athlete_id);
  db.audit(inv.academy_id, userId, `member_join:${inv.role}`, inv.role === 'parent' ? inv.athlete_id : null);
  return myAcademies(db, userId);
}

function listMembers(db, userId, academyId) {
  const { roles, fail } = requireMember(db, userId, academyId);
  if (fail) return fail;
  if (!roles.some((r) => STAFF.includes(r))) return err('FORBIDDEN', 403, 'قائمة الأعضاء للإدارة والمدربين والأخصائيين بس.');
  const showEmail = roles.includes('admin');
  const byUser = new Map();
  for (const m of db.members(academyId)) {
    const u = byUser.get(m.userId) || { userId: m.userId, roles: [], displayName: null, email: showEmail ? m.email : null, since: m.createdAt.slice(0, 10) };
    u.roles.push(m.role);
    u.displayName = u.displayName || m.displayName;
    byUser.set(m.userId, u);
  }
  return { members: [...byUser.values()].map((u) => ({ ...u, displayName: u.displayName || 'بدون اسم', rolesAr: u.roles.map((r) => ROLE_AR[r]) })) };
}

function removeMember(db, userId, academyId, targetId, body) {
  const { roles, fail } = requireMember(db, userId, academyId);
  if (fail) return fail;
  const self = targetId === userId;
  if (!self && !roles.includes('admin')) return err('FORBIDDEN', 403, 'المدير بس يقدر يشيل أعضاء.');
  if (body.confirm !== true) return err('CONFIRM_REQUIRED', 400, 'الإزالة بتلغي المشاركة وروابط ولي الأمر؛ أكّد الأول.');
  const targetRoles = db.rolesIn(targetId, academyId);
  if (!targetRoles.length) return NOT_FOUND();
  if (targetRoles.includes('admin') && db.countRole(academyId, 'admin') <= 1) return err('LAST_ADMIN', 400, 'لازم يفضل مدير واحد على الأقل.');
  db.removeMembership(academyId, targetId);
  db.audit(academyId, userId, self ? 'member_leave' : 'member_remove', targetId);
  return self ? myAcademies(db, userId) : listMembers(db, userId, academyId);
}

// ---------- guardians for athletes without an academy, and weight-loss consent for minors ----------
// The athlete gets a private "family" group (kind = 'family') and a one-time parent invite code.
function inviteGuardian(db, userId, body, deps) {
  let aid = db.familyOf(userId);
  if (!aid) {
    aid = db.createAcademy(`عائلة ${cleanName(body.displayName) || 'اللاعب'}`, userId, cleanName(body.displayName));
    db.setAcademyKind(aid, 'family');
    db.addMembership(aid, userId, 'athlete', cleanName(body.displayName));
    db.audit(aid, userId, 'family_create', null);

      if (next && !next.pre) { next.time = end + 45; next.post += 1; }

// Measured protein top-up that respects preferences, allergens and fasting.
const BOOSTERS = {

// ---- build one meal ----

  // diff compares calculated food with the target left for planned food (target minus the free-meal allowance)
  const base = { kcal: day.targets.kcal - (b ? b.kcal : 0), proteinG: day.targets.proteinG - (b ? b.protein : 0), carbG: day.targets.carbG - (b ? b.carb : 0), fatG: day.targets.fatG - (b ? b.fat : 0) };
  day.diff = { kcal: Math.round(t.kcal - base.kcal), protein: round(t.protein - base.proteinG, 0), carb: round(t.carb - base.carbG, 0), fat: round(t.fat - base.fatG, 0),
    basis: b ? 'target_minus_free_meal' : 'target' };
}

// Calories above target: trim carb sides first, then quarter-portions of the dish carrying the macro most over
// target (fat or carbohydrate), meals tied to training excluded, never letting protein fall under 95% of target. Keeps the planned deficit real.
const KCAL_TOL = 1.02;
function trimCalories(day, dayTargets, real, lib) {
  let over = planningTotals(day).kcal - dayTargets.kcal * KCAL_TOL;
  if (over <= 25) return;
  const hosts = real.filter((m) => m.extras.some((e) => e.kind === 'carb') && m.timing !== 'pre')
    .sort((a, b) => (a.timing ? 1 : 0) - (b.timing ? 1 : 0) || b.timeMin - a.timeMin);
  for (const host of hosts) {
    if (over <= 25 || planningTotals(day).carb <= dayTargets.carbG * 0.9) break;
    const carb = host.extras.find((e) => e.kind === 'carb');
    const f = FOODS.get(carb.items[0].foodId);
    const before = carb.items[0].grams;
    const keep = host.timing ? Math.round(before * 0.6) : 0;
    const roomCarb = Math.max(0, planningTotals(day).carb - dayTargets.carbG * 0.9);
    const remove = Math.min(before - keep, r10((over / f.kcal) * 100), r10((roomCarb / Math.max(1, f.carb)) * 100));
    if (remove <= 0) continue;
    const after = before - remove;
    if (after < 20) host.extras = host.extras.filter((e) => e !== carb);
    else { carb.items = [nutrientsFor(f.id, after)]; carb.totals = sum(carb.items); }
    refreshMeal(host);
    over = planningTotals(day).kcal - dayTargets.kcal * KCAL_TOL;
  }
  for (let guard = 0; over > 25 && guard < 8; guard++) {
    const t = planningTotals(day);
    // reduce the dish that carries the macro most over target (fat or carbohydrate)
    const fatX = t.fat - dayTargets.fatG * 1.05; const carbX = t.carb - dayTargets.carbG * 1.05;
    if (fatX <= 0 && carbX <= 0) break;
    const key = fatX * 9 >= carbX * 4 ? 'fat' : 'carb';
    const cand = real.filter((m) => !m.timing && m.recipeId && m.servings > 0.5)
      .map((m) => ({ m, r: lib.find((x) => x.id === m.recipeId) })).filter((x) => x.r && x.r.perServing[key] > 3)
      .sort((a, b) => b.r.perServing[key] - a.r.perServing[key])[0];
    if (!cand) break;
    if (t.protein - 0.25 * cand.r.perServing.protein < dayTargets.proteinG * 0.95) break;
    const part = scaledRecipe(cand.r, cand.m.servings - 0.25);
    cand.m.servings -= 0.25; cand.m.recipeItems = part.items; cand.m.recipeTotals = part.totals;
    refreshMeal(cand.m);
    over = planningTotals(day).kcal - dayTargets.kcal * KCAL_TOL;
  }
}

// ---- build one day ----
function buildDay(date, dayTargets, sessions, ctx, forced = {}, exclude = {}) {
  const wd = parseDate(date).getUTCDay();
  const ramadan = !!ctx.prefs.ramadan.enabled;
  const { slots, notes, sessions: sessOut } = daySlots(ctx.prefs, sessions, ramadan);
  ctx.dayUsed = new Set();
  ctx.training = sessions.length > 0;
  ctx.fast = fastingMode(ctx.prefs, wd);
  const freeHere = ctx.prefs.freeMeal.enabled && ctx.prefs.freeMeal.date === date;
  let freeDone = false;
  const sharedKinds = new Set();
  const meals = slots.map((s) => {
    const t = { protein: dayTargets.proteinG * s.pShare, carb: dayTargets.carbG * s.cShare, fat: dayTargets.fatG * s.pShare, kcal: dayTargets.kcal * (s.pShare + s.cShare) / 2 };
    if (freeHere && !freeDone && (s.kind === ctx.prefs.freeMeal.slot || (ramadan && s.ramadan === 'main')) && !s.timing) {
      freeDone = true;
      return { slot: s.kind, idx: s.idx, label: `${s.label} — وجبة حرة`, time: s.clock, timeMin: s.time, timing: null, free: true,
        target: { protein: Math.round(t.protein), carb: Math.round(t.carb), fat: Math.round(t.fat), kcal: Math.round(t.kcal) },
        note: `وجبة حرة مرة في الشهر: كُل اللي نفسك فيه في وجبة واحدة مش يوم كامل، والأحسن تبقى في حدود ${Math.round(t.kcal * 1.5)} سعرة تقريبًا. كمّل باقي اليوم عادي، ومتعوضهاش بالتجويع بعدها.` };
    }
    const hh = ctx.household && ctx.household[date];
    const shared = hh && !forced[s.idx] && !(exclude[s.idx] || []).length && !s.timing && hh[s.kind] && !sharedKinds.has(s.kind) ? hh[s.kind] : null;
    if (shared) sharedKinds.add(s.kind);
    const m = buildMeal(s, t, ctx, forced[s.idx], exclude[s.idx] || [], shared);
    if (!m.empty) {
      ctx.used.set(m.recipeId, (ctx.used.get(m.recipeId) || 0) + 1);
      if (isMain(s.kind)) { ctx.dayUsed.add(m.proteinType); ctx.typeCount.set(m.proteinType, (ctx.typeCount.get(m.proteinType) || 0) + 1); }
    }
    return m;
  });
  if (freeHere && !freeDone) notes.push('الوجبة الحرة النهارده متحطتش لأن الوجبة المختارة مرتبطة بالتمرين؛ خليها في وجبة بعيدة عن التمرين.');
  const real = meals.filter((m) => !m.empty && !m.free);
  const day = { date, weekday: wd, dayAr: DAY_AR[wd], training: sessions.length > 0, sessions: sessOut, ramadan, fasting: ctx.fast, meals, notes, added: [],
    targets: { kcal: dayTargets.kcal, proteinG: dayTargets.proteinG, carbG: dayTargets.carbG, fatG: dayTargets.fatG } };
  // Remaining protein goes to the post-training meal or dinner.
  const pGap = dayTargets.proteinG - planningTotals(day).protein;
  if (pGap >= 8) {
    const host = real.find((m) => m.timing === 'post') || real.find((m) => m.slot === 'dinner') || real[real.length - 1];
    const b = host && proteinBooster(pGap, host.slot, ctx.prefs, ctx.fast, 8, host.proteinType);
    if (b) {
      const same = host.extras.find((e) => e.kind === 'protein' && e.items[0].foodId === b.items[0].foodId);
      if (same) { same.items = [nutrientsFor(b.items[0].foodId, Math.min(300, same.items[0].grams + b.items[0].grams))]; same.totals = sum(same.items); }
      else host.extras.push(b);
      refreshMeal(host);
    }
  }
  // Remaining carbohydrate goes to the post-training meal or lunch.
  const cGap = dayTargets.carbG - planningTotals(day).carb;
  if (cGap >= 15 && ctx.prefs.carbs.length) {
    const host = real.find((m) => m.timing === 'post' && m.slot !== 'snack') || real.find((m) => m.slot === 'lunch') || real[0];
    const existing = host && host.extras.find((e) => e.kind === 'carb');
    const key = existing ? Object.keys(CARB_SOURCES).find((k) => CARB_SOURCES[k].ar === existing.ar) : ctx.prefs.carbs[0];
    const src = CARB_SOURCES[key];
    const add = r10((cGap / FOODS.get(src.food).carb) * 100);
    if (host && add >= 20) {
      if (existing) { existing.items = [nutrientsFor(src.food, existing.items[0].grams + add)]; existing.totals = sum(existing.items); }
      else { const it = nutrientsFor(src.food, add); host.extras.push({ kind: 'carb', ar: src.ar, items: [it], totals: sum([it]) }); }
      refreshMeal(host);
    }
  }
  // Too much carbohydrate (carb-heavy dishes, plant protein): trim carb sides, latest meals first, keeping training meals for last.
  let over = planningTotals(day).carb - dayTargets.carbG;
  if (over > 15) {
    const hosts = real.filter((m) => m.extras.some((e) => e.kind === 'carb')).sort((a, b) => (a.timing ? 1 : 0) - (b.timing ? 1 : 0) || b.timeMin - a.timeMin);
    for (const host of hosts) {
      if (over <= 10) break;
      const carb = host.extras.find((e) => e.kind === 'carb');
      const f = FOODS.get(carb.items[0].foodId);
      const before = carb.items[0].grams;
      const keep = host.timing ? Math.round(before * 0.5) : 0;
      const remove = Math.min(before - keep, r10((over / f.carb) * 100));
      if (remove <= 0) continue;
      const after = before - remove;
      if (after < 20) host.extras = host.extras.filter((e) => e !== carb);
      else { carb.items = [nutrientsFor(f.id, after)]; carb.totals = sum(carb.items); }
      refreshMeal(host);
      over -= ((after < 20 ? before : remove) * f.carb) / 100;
    }
  }
  // Close the fat gap with measured olive oil on the lunch salad.
  const fatGap = dayTargets.fatG - planningTotals(day).fat;
  if (fatGap >= 4) {
    const host = real.find((m) => m.slot === 'lunch' && m.timing !== 'pre') || real.find((m) => !m.timing) || real[0];
    const g = r5(Math.min(fatGap, 25));
    if (host && g > 0) { const it = nutrientsFor('olive_oil', g); host.extras.push({ kind: 'fat', ar: 'زيت زيتون على السلطة', items: [it], totals: sum([it]) }); refreshMeal(host); }
  }
  trimCalories(day, dayTargets, real, ctx.lib);
  setDayTotals(day);
  return day;
}

// Daily targets scale with the training actually scheduled that day (number and length of sessions).
function makeTargets(targets, prefs, athlete = {}) {
  const tr = targets.trainingDay || targets.restDay;
  const rest = targets.restDay || targets.trainingDay;
  const refLoad = Math.max(0.5, (athlete.sessionsPerWeek || 1) / Math.max(1, athlete.trainingDays || 1)) * (athlete.minutesPerSession || 60);
  const forDay = (sessions) => {
    if (!sessions.length || !targets.trainingDay) return { ...rest };
    const load = sessions.reduce((t, s) => t + s.duration, 0) / refLoad;
    const scale = (k) => Math.round(rest[k] + (tr[k] - rest[k]) * Math.min(2.2, load));
    return { kcal: scale('kcal'), proteinG: tr.proteinG, carbG: scale('carbG'), fatG: scale('fatG'), fiberG: scale('fiberG') };
  };
  if (prefs.carbStrategy !== 'even') return forDay;
  const week = [0, 1, 2, 3, 4, 5, 6].map((d) => forDay(prefs.schedule[d] || []));
  const avg = (k) => Math.round(week.reduce((t, x) => t + x[k], 0) / 7);
  const even = { kcal: avg('kcal'), proteinG: avg('proteinG'), carbG: avg('carbG'), fatG: avg('fatG'), fiberG: avg('fiberG') };
  return () => ({ ...even });
}

// dataMode 'reviewed_only': only recipes whose every ingredient has a human-reviewed value may be used.
function libraryFor(dataMode) {
  const all = listRecipes().recipes;
  return dataMode === 'reviewed_only' ? all.filter((r) => r.plan.reviewed) : all;
}

function generateWeekPlan({ targets, prefs, startDate, seed = 1, athlete = {}, dataMode = 'estimates', household = null }) {
  const lib = libraryFor(dataMode);
  if (dataMode === 'reviewed_only' && lib.filter((r) => r.plan.role === 'main').length < 10) {
    throw Object.assign(new Error('الإعداد يسمح بالقيم المراجعة بس، وعدد الوصفات المراجعة لسه ما يكفيش لعمل خطة.'), { code: 'NOT_ENOUGH_REVIEWED_DATA' });
  }
  const forDay = makeTargets(targets, prefs, athlete);
  const ctx = { prefs, lib, rand: rng(seed), used: new Map(), typeCount: new Map(), carbTurn: 0, dessertsLeft: prefs.dessertsPerWeek,
    sauces: lib.filter((r) => r.plan.role === 'sauce'), household: household && household.menu };
  const days = [];
  for (let i = 0; i < 7; i++) {
    const date = addDays(startDate, i);
    const sessions = prefs.schedule[parseDate(date).getUTCDay()] || [];
    days.push(buildDay(date, forDay(sessions), sessions, ctx));
  }
  const plan = finalize({ startDate, seed, prefs, athlete, targetsBase: targets, days });
  plan.dataMode = dataMode;
  if (household) {
    const meals = days.flatMap((d) => d.meals);
    plan.household = { name: household.name, sharedMeals: meals.filter((m) => m.shared).length, differentMeals: meals.filter((m) => m.sharedNote).length };
  }
  return plan;
}

function planCtx(plan, seed, carbTurn = 0) {
  const lib = libraryFor(plan.dataMode);
  const used = new Map();
  plan.days.forEach((d) => d.meals.forEach((m) => { if (m.recipeId) used.set(m.recipeId, (used.get(m.recipeId) || 0) + 1); }));
  return { prefs: plan.prefs, lib, rand: rng(seed), used, typeCount: new Map(), carbTurn, dessertsLeft: 0, sauces: lib.filter((r) => r.plan.role === 'sauce') };
}

// Replace one meal, keeping everything else in that day (added drinks/snacks are kept).
function swapMeal(plan, dayIndex, slotIdx, seed) {
  const day = plan.days[dayIndex];
  if (!day) throw Object.assign(new Error('اليوم غير موجود.'), { code: 'BAD_DAY' });
  const old = day.meals.find((m) => m.idx === slotIdx);
  if (!old || old.free) throw Object.assign(new Error('الوجبة غير موجودة.'), { code: 'BAD_SLOT' });
  const forced = {};
  // Household meals in the same day keep their dish and sides; the swapped meal leaves the household menu.
  const keepShared = householdMenu({ days: [{ ...day, meals: day.meals.filter((m) => m.shared && m.idx !== slotIdx) }] }, ['breakfast', 'lunch', 'dinner']);
  day.meals.forEach((m) => { if (m.idx !== slotIdx && m.recipeId && !m.shared) forced[m.idx] = m.recipeId; });
  const exclude = { [slotIdx]: [...(old.excluded || []), old.recipeId].filter(Boolean) };
  const ctx = planCtx(plan, seed, dayIndex);
  ctx.household = keepShared;
  const sessions = (plan.prefs.schedule[day.weekday] || []);
  const nd = buildDay(day.date, day.targets, sessions, ctx, forced, exclude);
  const nm = nd.meals.find((m) => m.idx === slotIdx);
  if (nm) nm.excluded = exclude[slotIdx].slice(-20);
  const added = day.added || [];
  plan.days[dayIndex] = nd;
  added.forEach((a) => applyAdded(nd, a.recipeId, a.servings, a.attachTo, a.compensate));
  setDayTotals(nd);
  return finalize(plan);
}

// ---- user-added drinks, snacks and sauces ----
function applyAdded(day, recipeId, servings, attachTo, compensate) {
  const r = listRecipes().recipes.find((x) => x.id === recipeId);
  const part = scaledRecipe(r, servings);
  const entry = { id: `${recipeId}-${(day.added || []).length}-${Date.now() % 100000}`, recipeId, ar: r.ar, role: r.plan.role, servings, attachTo, compensate,
    items: part.items, totals: part.totals, compensation: null };
  if (compensate && part.totals.carb >= 5) {
    // Take the same carbohydrate off carb sides: the attached meal first, then the later meals of the day.
    let need = part.totals.carb;
    const hosts = day.meals.filter((m) => !m.empty && !m.free && m.extras && m.extras.some((e) => e.kind === 'carb'));
    const ordered = [...hosts.filter((m) => m.idx === attachTo), ...hosts.filter((m) => m.idx !== attachTo).reverse()];
    const comp = [];
    for (const host of ordered) {
      if (need < 3) break;
      const carb = host.extras.find((e) => e.kind === 'carb');
      const f = FOODS.get(carb.items[0].foodId);
      const before = carb.items[0].grams;
      const remove = Math.min(before, Math.max(10, r10((need / f.carb) * 100)));
      if (remove <= 0) continue;
      carb.items = [nutrientsFor(f.id, before - remove)]; carb.totals = sum(carb.items);
      refreshMeal(host);
      need -= (remove * f.carb) / 100;
      comp.push({ mealIdx: host.idx, foodId: f.id, grams: remove, ar: f.ar });
    }
    if (comp.length) entry.compensation = comp;
  }
  day.added = [...(day.added || []), entry];
  return entry;
}
function addExtra(plan, dayIndex, recipeId, servings = 1, attachTo = null, compensate = true) {
  const day = plan.days[dayIndex];
  if (!day) throw Object.assign(new Error('اليوم غير موجود.'), { code: 'BAD_DAY' });
  const r = listRecipes().recipes.find((x) => x.id === recipeId);
  if (!r || !['drink', 'snack', 'sauce', 'dessert', 'side'].includes(r.plan.role) && !r.plan.slots.includes('snack')) {
    throw Object.assign(new Error('اختار مشروب أو سناك أو صوص من القايمة.'), { code: 'BAD_RECIPE' });
  }
  if (!allowed(r, plan.prefs, day.fasting)) throw Object.assign(new Error('الصنف ده فيه مكوّن ممنوع في تفضيلاتك أو في الصيام.'), { code: 'NOT_ALLOWED' });
  const s = Math.min(3, Math.max(0.5, Math.round(Number(servings) * 2) / 2 || 1));
  applyAdded(day, recipeId, s, attachTo, compensate);
  setDayTotals(day);
  return finalize(plan);
}
function removeExtra(plan, dayIndex, entryId) {
  const day = plan.days[dayIndex];
  const entry = day && (day.added || []).find((a) => a.id === entryId);
  if (!entry) throw Object.assign(new Error('الإضافة غير موجودة.'), { code: 'BAD_EXTRA' });
  for (const c of entry.compensation || []) {
    const host = day.meals.find((m) => m.idx === c.mealIdx);
    const carb = host && host.extras.find((e) => e.kind === 'carb' && e.items[0].foodId === c.foodId);
    if (carb) { carb.items = [nutrientsFor(c.foodId, carb.items[0].grams + c.grams)]; carb.totals = sum(carb.items); refreshMeal(host); }
  }
  day.added = day.added.filter((a) => a.id !== entryId);
  setDayTotals(day);
  return finalize(plan);
}

const GROUP_AR = { protein: 'بروتين', legume: 'بقوليات', dairy: 'ألبان وجبن', grain: 'حبوب ونشويات', starch: 'حبوب ونشويات', vegetable: 'خضار', herb: 'أعشاب', fruit: 'فاكهة', fat: 'زيوت ومكسرات', sweetener: 'سكر وعسل', condiment: 'صلصات وتوابل', spice: 'صلصات وتوابل', drink: 'مشروبات' };

function finalize(plan) {
  const all = plan.days.flatMap((d) => [...d.meals.flatMap(mealItems), ...(d.added || []).flatMap((a) => a.items)]);
  const byFood = new Map();
  for (const i of all) {
    if (i.foodId === 'water' || i.foodId === 'salt') continue;
    const f = FOODS.get(i.foodId);
    const cur = byFood.get(i.foodId) || { foodId: i.foodId, ar: f.ar, group: GROUP_AR[f.group] || 'أخرى', state: f.state, grams: 0, unitG: f.unitG || null, unitAr: f.unitAr || null };
    cur.grams += i.grams;
    byFood.set(i.foodId, cur);
  }
  plan.grocery = [...byFood.values()].map((g) => ({ ...g, grams: g.grams < 10 ? Math.ceil(g.grams) : Math.ceil(g.grams / 10) * 10,
    units: g.unitG ? `≈ ${Math.ceil(g.grams / g.unitG)} ${g.unitAr}` : null }))
    .sort((a, b) => (a.group === b.group ? b.grams - a.grams : a.group.localeCompare(b.group, 'ar')));
  plan.weekTotals = sum(all);
  plan.dataStatus = {
    status: plan.weekTotals.dataStatus,
    reviewedKcalPct: plan.weekTotals.reviewedKcalPct,
    label: plan.weekTotals.dataStatus === 'reviewed' ? 'كل القيم الغذائية في الخطة مراجعة.' : `القيم الغذائية تقديرية: ${plan.weekTotals.reviewedKcalPct}% بس من السعرات من أصناف اتراجعت. الأرقام للتخطيط، مش قيم معتمدة.`,
  };
  plan.micros = {
    ironMgPerDay: round(plan.days.reduce((t, d) => t + d.totals.ironMg, 0) / 7, 1),
    vitDugPerDay: round(plan.days.reduce((t, d) => t + d.totals.vitDug, 0) / 7, 1),
    ironRichMeals: plan.days.flatMap((d) => d.meals).filter((m) => m.ironRich).length,
    vitDRichMeals: plan.days.flatMap((d) => d.meals).filter((m) => m.vitDRich).length,
    ironCoveragePct: Math.round((plan.days.reduce((t, d) => t + (d.totals.ironCoverage || 0), 0) / 7) * 100),
    vitDCoveragePct: Math.round((plan.days.reduce((t, d) => t + (d.totals.vitDCoverage || 0), 0) / 7) * 100),
    calciumMgPerDay: Math.round(plan.days.reduce((t, d) => t + (d.totals.calciumMg || 0), 0) / 7),
    calciumCoveragePct: Math.round((plan.days.reduce((t, d) => t + (d.totals.calciumCoverage || 0), 0) / 7) * 100),
    // audit D3 (2026-10-22): the old note said calcium was not recorded and values were unreviewed — both stale.
    note: 'الأرقام حد أدنى: محسوبة من الأصناف اللي ليها قيمة للحديد أو فيتامين د أو الكالسيوم في قاعدة البيانات بس (نسبة التغطية بالجرام جنب كل واحد). أي صنف من غير قيمة مش بيتحسب صفر في الحقيقة.',
  };
  const a0 = plan.athlete || {};
  const dri = driFor({ age: a0.age, sex: a0.sex });
  if (dri) {
    plan.micros.dri = {
      ironMg: { rda: dri.ironMg.rda, ul: dri.ironMg.ul, pctOfRda: Math.round((plan.micros.ironMgPerDay / dri.ironMg.rda) * 100) },
      vitDug: { rda: dri.vitDIU.rdaUg, ul: dri.vitDIU.ulUg, pctOfRda: Math.round((plan.micros.vitDugPerDay / dri.vitDIU.rdaUg) * 100) },
      calciumMg: { rda: dri.calciumMg.rda, ul: dri.calciumMg.ul, pctOfRda: Math.round((plan.micros.calciumMgPerDay / dri.calciumMg.rda) * 100) },
      sources: dri.sources,
      note: 'RDA من الإرشادات الغذائية الأمريكية 2015–2020 (ملحق 7)، والحد الأعلى (UL) من Advanced Nutrition and Human Metabolism ط8. الحد الأعلى بيخص الأكل والمكملات مع بعض.',
    };
  }
  plan.proteinMix = Object.entries(plan.days.flatMap((d) => d.meals).filter((m) => isMain(m.slot) && m.proteinType)
    .reduce((o, m) => { o[m.proteinType] = (o[m.proteinType] || 0) + 1; return o; }, {})).map(([k, n]) => ({ type: k, ar: PROTEIN_TYPES[k] || k, meals: n }))
    .sort((a, b) => b.meals - a.meals);
  plan.approach = approach(plan);
  return plan;
}

function approach(plan) {
  const p = plan.prefs;
  const a = plan.athlete || {};
  const out = [];
  const tDays = plan.days.filter((d) => d.training);
  const double = plan.days.filter((d) => d.sessions.length === 2);
  const rest = plan.days.find((d) => !d.training);
  const trainDay = tDays[0];
  out.push(p.ramadan.enabled

// UL:  Gropper, Smith & Carr, Advanced Nutrition and Human Metabolism 8th ed., front-matter UL tables — ref "gropper2022".
// Values are copied from those tables; nothing here is estimated. Pregnancy/lactation are not modelled
// (the app refers those users to a professional instead).

  calciumMg: [[1, 3, 700, 700], [4, 8, 1000, 1000], [9, 13, 1300, 1300], [14, 18, 1300, 1300], [19, 50, 1000, 1000], [51, 70, 1200, 1000], [71, 200, 1200, 1200]],
  ironMg: [[1, 3, 7, 7], [4, 8, 10, 10], [9, 13, 8, 8], [14, 18, 15, 11], [19, 50, 18, 8], [51, 200, 8, 8]],
  vitDIU: [[1, 70, 600, 600], [71, 200, 800, 800]],
};
// UL is the same for both sexes in these tables.
const UL = {
  calciumMg: [[1, 8, 2500], [9, 18, 3000], [19, 50, 2500], [51, 200, 2000]],
  ironMg: [[1, 13, 40], [14, 200, 45]],
  vitDIU: [[1, 3, 2500], [4, 8, 3000], [9, 200, 4000]],
};

function lookup(table, age, sex) {
  const row = table.find((r) => age >= r[0] && age <= r[1]);
  if (!row) return null;
  if (row.length === 3) return row[2];
  return sex === 'male' ? row[3] : row[2];

  out.vitDIU.rdaUg = out.vitDIU.rda / IU_PER_UG_VITD;
  out.vitDIU.ulUg = out.vitDIU.ul / IU_PER_UG_VITD;

// unknown is reported as unknown, never as zero.
function compareIntake(intake, dri, { complete = true } = {}) {
  const res = {};
  for (const k of ['calciumMg', 'ironMg', 'vitDIU']) {
    const v = intake[k];
    const d = dri[k];

    const pct = Math.round((v / d.rda) * 100);

const HM = /^([01]\d|2[0-3]):([0-5]\d)$/;

function validateCompetition(b, today) {

// Simple, low-fibre foods that are easy on the stomach near races. Picked in order, skipping avoided ones.
const CARBS_LIGHT = ['banana', 'dates', 'white_bread', 'honey', 'jam'];
const CARBS_MEAL = ['rice_white_cooked', 'white_bread', 'pasta_cooked', 'potato_boiled'];
const CARBS_MEAL_ALT = ['pasta_cooked', 'white_bread', 'rice_white_cooked', 'potato_boiled'];
const CARBS_BREAKFAST = ['white_bread', 'banana', 'honey', 'dates'];
const PROTEIN_LIGHT = ['greek_yogurt', 'areesh_cheese', 'egg_white', 'chicken_breast_cooked', 'tuna_water'];

<script>
'use strict';
// Goal timeline chart (hand-built SVG, no external libraries).
// One y-axis (kg). Planned/scenario lines are straight lines at explicit rates; actual = weekly averages.
window.TimelineChart = (function () {
  const NS = 'http://www.w3.org/2000/svg';
  const DAY = 86400000;
  const d2n = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const fmtDate = (ms) => new Date(ms).toISOString().slice(0, 10);
  const shortDate = (ms) => { const d = new Date(ms); return `${d.getUTCDate()}/${d.getUTCMonth() + 1}`; };

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }

  function render(container, tl, goal) {
    container.innerHTML = '';
    const W = 640, H = 300, L = 40, R = 14, T = 16, B = 34;
    const start = d2n(goal.startDate);
    const scen = Object.fromEntries(tl.scenarios.map((s) => [s.key, s]));
    const endDate = Math.max(d2n(scen.slowest.completionDate), d2n(tl.projection.completionDate),
      ...tl.actual.map((a) => d2n(a.date) + 7 * DAY));
    const ys = [tl.startWeight, tl.targetWeight, ...tl.actual.map((a) => a.weight)];
    const lo = Math.floor(Math.min(...ys) - 0.5), hi = Math.ceil(Math.max(...ys) + 0.5);
    const x = (ms) => L + ((ms - start) / (endDate - start)) * (W - L - R);
    const y = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);

    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', direction: 'ltr',
      'aria-label': `مخطط الوزن: من ${tl.startWeight} إلى ${tl.targetWeight} كجم، الوزن الحالي ${tl.currentWeight} كجم` }, container);

    // grid + y labels
    const step = Math.max(1, Math.round((hi - lo) / 5));
    for (let v = lo; v <= hi; v += step) {
      el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'svg-grid', 'stroke-width': 1 }, svg);
      el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'svg-axis' }, svg).textContent = v;
    }
    // x ticks (about 5)
    const spanDays = (endDate - start) / DAY;
    const tickEvery = Math.max(7, Math.ceil(spanDays / 5 / 7) * 7);
    for (let d = 0; d <= spanDays; d += tickEvery) {
      el('text', { x: x(start + d * DAY), y: H - 12, 'text-anchor': 'middle', class: 'svg-axis' }, svg).textContent = shortDate(start + d * DAY);
    }

    // target line
    el('line', { x1: L, x2: W - R, y1: y(tl.targetWeight), y2: y(tl.targetWeight), class: 'svg-target', 'stroke-width': 1.5, 'stroke-dasharray': '2 4' }, svg);
    el('text', { x: W - R, y: y(tl.targetWeight) - 6, 'text-anchor': 'end', class: 'svg-label' }, svg).textContent = `الهدف ${tl.targetWeight}`;

    const lineTo = (s, cls, dash) => {
      el('line', { x1: x(start), y1: y(tl.startWeight), x2: x(d2n(s.completionDate)), y2: y(tl.targetWeight),
        class: cls, 'stroke-width': 2, 'stroke-linecap': 'round', ...(dash ? { 'stroke-dasharray': dash } : {}) }, svg);
    };
    lineTo(scen.slowest, 'svg-slow', '2 5');
    lineTo(scen.conservative, 'svg-cons', '8 5');
    lineTo(scen.medium, 'svg-plan', '5 4');

    // actual weekly averages
    const act = tl.actual.map((a) => ({ ...a, ms: d2n(a.date) + 3 * DAY }));
    if (act.length) {
      el('path', { d: act.map((p, i) => `${i ? 'L' : 'M'}${x(p.ms).toFixed(1)},${y(p.weight).toFixed(1)}`).join(' '),
        class: 'svg-actual', fill: 'none', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, svg);
      act.forEach((p) => el('circle', { cx: x(p.ms), cy: y(p.weight), r: 4.5, class: 'svg-actual-dot' }, svg));
      const lp = act[act.length - 1];
      el('text', { x: x(lp.ms), y: y(lp.weight) - 10, 'text-anchor': 'middle', class: 'svg-label' }, svg).textContent = `${lp.weight}`;
    }
    // projected date marker
    const pd = d2n(tl.projection.completionDate);
    el('line', { x1: x(pd), x2: x(pd), y1: y(tl.targetWeight) - 8, y2: y(tl.targetWeight) + 8, class: 'svg-actual', 'stroke-width': 2 }, svg);

    // hover layer: crosshair + tooltip per week
    const cross = el('line', { y1: T, y2: H - B, class: 'svg-cross', 'stroke-width': 1, visibility: 'hidden' }, svg);
    const tip = document.createElement('div');
    tip.className = 'tooltip hidden';
    container.appendChild(tip);
    const hit = el('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' }, svg);
    const plannedAt = (ms, s) => {
      const wk = (ms - start) / (7 * DAY);
      return Math.max(tl.targetWeight, tl.startWeight - s.rateKg * wk);
    };
    const move = (evt) => {
      const pt = svg.createSVGPoint();
      const src = evt.touches ? evt.touches[0] : evt;
      pt.x = src.clientX; pt.y = src.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const ms = start + ((p.x - L) / (W - L - R)) * (endDate - start);
      const wk = Math.max(0, Math.round((ms - start) / (7 * DAY)));
      const wms = start + wk * 7 * DAY;
      const a = act.find((q) => Math.round((q.ms - 3 * DAY - start) / (7 * DAY)) === wk);
      cross.setAttribute('x1', x(wms)); cross.setAttribute('x2', x(wms)); cross.setAttribute('visibility', 'visible');
      tip.innerHTML = '';
      const lines = [`الأسبوع ${wk + 1} · ${fmtDate(wms)}`, `المخطط: ${plannedAt(wms, scen.medium).toFixed(1)} كجم`];
      if (a) lines.push(`المتوسط الفعلي: ${a.weight} كجم`);
      lines.forEach((s, i) => { const d = document.createElement('div'); d.textContent = s; if (i === 0) d.className = 'muted'; tip.appendChild(d); });
      const box = container.getBoundingClientRect();
      tip.style.left = `${Math.min(Math.max(src.clientX - box.left, 70), box.width - 70)}px`;
      tip.style.top = `${src.clientY - box.top}px`;
      tip.classList.remove('hidden');
    };
    const leave = () => { cross.setAttribute('visibility', 'hidden'); tip.classList.add('hidden'); };
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchmove', move, { passive: true });
    hit.addEventListener('mouseleave', leave);
    hit.addEventListener('touchend', leave);
  }

  return { render };
})();

</script>

        h('div', { class: 'row' }, wField('نسبة الدهون المستهدفة %', 'targetBodyFatPct', { optional: true }), wField('محيط الخصر المستهدف (سم)', 'targetWaistCm', { optional: true })),
        wField('الهدف الأساسي', 'primaryGoal', { rerender: true, options: [...LOSS_GOALS, ...GAIN_GOALS].map((k) => [k, t(`goal.${k}`)]),

        h('label', {}, 'انت رياضي؟'),
        h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'رياضي ولا لأ' }, [[true, 'رياضي (بتمرن رياضة معينة)'], [false, 'مش رياضي']].map(([v, l]) =>
          h('button', { type: 'button', role: 'radio', 'aria-checked': W.data.isAthlete === v ? 'true' : 'false', class: W.data.isAthlete === v ? 'active' : null,
            onclick: () => { W.data.isAthlete = v; if (!v) { W.data.sport = 'general'; W.data.discipline = null; W.data.swimDiscipline = null; W.data.competitionDate = null; } else if (!W.data.seasonPhase) W.data.seasonPhase = 'pre_season'; renderWizard(); } }, l))),
        wField(W.data.isAthlete ? 'النشاط اليومي خارج التدريب' : 'نشاطك اليومي (شغل، مشي، حركة)', 'activityLevel', { options: ['sedentary', 'light', 'active', 'very_active'].map((k) => [k, t(`act.${k}`)]),
          hint: 'التدريب يُحسب منفصلًا حتى لا يُحتسب النشاط الرياضي مرتين.' }),
        W.data.isAthlete === false ? h('p', { class: 'small muted' }, 'لو بتتمرن (جيم، مشي سريع، أي نشاط) اكتب عدد المرات والمدة؛ لو مش بتتمرن خليهم 0.') : null,
        W.data.isAthlete === false ? null : wField('نوع الرياضة', 'sport', { options: sports.filter(([k]) => k !== 'general'), rerender: true, onSet: () => { W.data.discipline = null; W.data.swimDiscipline = W.data.sport === 'swimming' || W.data.sport === 'fin_swimming' ? W.data.swimDiscipline : null; } }),
        W.data.isAthlete && (W.data.sport === 'swimming' || W.data.sport === 'fin_swimming') ? wField('التخصص', 'swimDiscipline', { optional: true, options: [['sprint', 'سرعات (50–100م)'], ['middle', 'مسافات متوسطة (200–400م)'], ['distance', 'مسافات طويلة (800–1500م)'], ['open_water', 'مياه مفتوحة'], ['mono', 'زعانف «مونو»'], ['bi_fins', 'زعانف مزدوجة (Bi-fins)'], ['apnea', 'غطس (Apnea)']] }) : null,
        W.data.isAthlete && W.data.sport === 'fencing' ? wField('السلاح', 'discipline', { optional: true, options: [['foil', 'شيش (Foil)'], ['epee', 'سيف مبارزة (Épée)'], ['sabre', 'سيبر (Sabre)']] }) : null,
        W.data.isAthlete && W.data.sport === 'triathlon' ? wField('المسافة', 'discipline', { optional: true, options: [['sprint_tri', 'سبرنت'], ['olympic', 'أولمبي'], ['half', 'نص آيرونمان (70.3)'], ['full', 'آيرونمان كامل']] }) : null,
        h('div', { class: 'row' }, wField(W.data.isAthlete ? 'عدد الحصص أسبوعيًا' : 'مرات التمرين في الأسبوع', 'sessionsPerWeek'), wField(W.data.isAthlete ? 'مدة الحصة (دقيقة)' : 'مدة التمرين (دقيقة)', 'minutesPerSession')),
        wField(W.data.isAthlete ? 'شدة التدريب' : 'شدة التمرين', 'intensity', { options: ['low', 'moderate', 'high'].map((k) => [k, t(`int.${k}`)]) }),
        W.data.isAthlete === false ? null : wField('مرحلة الموسم', 'seasonPhase', { options: [['off_season', 'خارج الموسم'], ['pre_season', 'فترة الإعداد'], ['in_season', 'فترة المنافسات'], ['transition', 'الراحة الانتقالية']],
          hint: isGainGoal(W.data.primaryGoal) ? 'المرحلة بتحدد أقصى معدل زيادة وكمية الكربوهيدرات.' : 'المرحلة بتحدد أقصى معدل خسارة آمن وكمية الكربوهيدرات.' }),
        W.data.isAthlete === false ? null : wField('موعد أقرب منافسة', 'competitionDate', { type: 'date', optional: true }),
        wField('معدل الأيض المقاس RMR (سعرة/يوم)', 'measuredRmr', { optional: true, hint: 'لو اتقاس بجهاز (Indirect calorimetry) في معمل؛ لو مش متاح سيبه فاضي ونحسبه بالمعادلة.' }),
      ],
      () => [
        h('p', { class: 'muted small' }, 'من 1 (منخفض) إلى 5 (مرتفع). اتركها فارغة إن لم تكن متأكدًا.'),
        wField('مستوى الجوع', 'hunger', { scale: true }), wField('مستوى الطاقة', 'energy', { scale: true }),
        wField('جودة النوم', 'sleep', { scale: true }), wField('القدرة على الالتزام', 'adherence', { scale: true }),
        isGainGoal(W.data.primaryGoal) ? null : wField('متوسط تغير وزنك الأسبوعي مؤخرًا (كجم، الخسارة بالموجب)', 'recentWeeklyChangeKg', { optional: true }),
        wField('لدي حالة طبية تؤثر في الوزن أو التغذية', 'medicalCondition', { check: true }),
        wField('أتناول أدوية تؤثر في الوزن أو الشهية', 'weightMedication', { check: true }),
        W.data.sex === 'female' ? wField('حامل أو مرضعة', 'pregnantOrBreastfeeding', { check: true }) : null,
      ],
      () => previewStep(),
    ][s]();

    const isLast = s === STEP_FIELDS.length - 1;
    $view.appendChild(h('div', {},
      h('h1', {}, isGainGoal(W.data.primaryGoal) ? 'هدفي في زيادة الوزن' : t('goal.title')),
      h('div', { class: 'steps', 'aria-hidden': 'true' }, STEP_FIELDS.map((_, i) => h('span', { class: i <= s ? 'on' : null }))),
      !S.st?.goal && s === 0 ? h('div', { class: 'notice info' }, h('strong', {}, 'مدرب أو أخصائي أو ولي أمر، أو معاك كود من أكاديمية؟'),
        h('div', { class: 'actions' }, h('button', { type: 'button', onclick: () => go('team') }, 'الأكاديمية والفريق'))) : null,
      h('div', { class: 'card' }, h('h2', {}, `${s + 1}. ${STEP_TITLES[s]}`), body,
        h('div', { class: 'actions' },
          s > 0 ? h('button', { type: 'button', onclick: () => { W.step--; renderWizard(); } }, 'السابق') :
            (S.st?.goal ? h('button', { type: 'button', onclick: () => { S.wizard = null; go('dashboard'); } }, 'إلغاء') : null),
          isLast ? h('button', { type: 'button', class: 'primary', disabled: !W.preview || null, onclick: saveGoal }, 'حفظ الخطة') :
            h('button', { type: 'button', class: 'primary', onclick: next }, s === STEP_FIELDS.length - 2 ? 'احسب الخطة' : 'التالي')))));
  }

  async function next() {
    const W = S.wizard;
    W.step++;
    if (W.step === STEP_FIELDS.length - 1) { await runPreview(); return; }
    renderWizard();
  }

  function payload() {
    const d = { ...S.wizard.data };
    if (S.wizard.rateMode !== 'custom') d.weeklyRateKg = null;
    return d;
  }

  async function runPreview() {
    const W = S.wizard;
    W.preview = null; W.errors = {}; W.previewError = null;
    renderWizard();
    try {
      W.preview = await api('POST', '/api/goal/preview', payload());
    } catch (e) {
      const errs = e.data?.errors || {};
      W.errors = errs;
      const firstStep = STEP_FIELDS.findIndex((fs) => fs.some((f) => errs[f]));
      if (firstStep >= 0 && firstStep < STEP_FIELDS.length - 1) { W.step = firstStep; }
      else W.previewError = Object.values(errs)[0] || 'تعذر حساب الخطة.';
    }
    renderWizard();
  }

  function previewStep() {
    const W = S.wizard, P = W.preview;
    if (W.previewError) return [notice('bad', W.previewError)];
    if (!P) return [h('p', { class: 'muted' }, 'جارٍ الحساب…')];
    const p = P.plan, r = p.recommendation, tl = p.timeline, n = p.nutrition;
    const gain = p.direction === 'gain';
    const customInput = h('input', { type: 'number', step: '0.01', inputmode: 'decimal', value: W.data.weeklyRateKg ?? r.recommendedKg,
      oninput: (e) => { W.data.weeklyRateKg = e.target.value === '' ? null : Number(e.target.value); } });
    return [
      h('div', { class: 'card flat' },
        h('h3', {}, 'المعدل الأسبوعي'),
        h('p', {}, 'المعدل الموصى به لحالتك: ', h('strong', {}, num(r.recommendedKg, 2), ' كجم/أسبوع'), ` (${fmt(r.recommendedPct, 2)}% من الوزن)`),
        h('p', { class: 'small muted' }, 'النطاق المسموح لحالتك: ', num(r.allowedRangeKg[0], 2), ' – ', num(r.allowedRangeKg[1], 2), ' كجم/أسبوع'),
        r.reasons.length ? h('ul', { class: 'small' }, r.reasons.map((x) => h('li', {}, x))) : null,
        h('p', { class: 'small muted' }, r.note),
        h('div', { class: 'seg' },
          h('button', { type: 'button', class: W.rateMode === 'recommended' ? 'active' : null, onclick: () => { W.rateMode = 'recommended'; runPreview(); } }, 'الموصى به'),
          h('button', { type: 'button', class: W.rateMode === 'custom' ? 'active' : null, onclick: () => { W.rateMode = 'custom'; W.data.weeklyRateKg ??= r.recommendedKg; renderWizard(); } }, 'معدل مخصص')),
        W.rateMode === 'custom' ? h('div', {}, h('label', {}, 'المعدل المخصص (كجم/أسبوع)'), customInput,
          W.errors.weeklyRateKg ? h('div', { class: 'field-error' }, W.errors.weeklyRateKg) : null,
          h('div', { class: 'actions' }, h('button', { type: 'button', onclick: runPreview }, 'أعد الحساب'))) : null),
      p.requiresProfessional ? notice('bad', 'هذه الخطة تحتاج مراجعة أخصائي تغذية رياضية أو طبيب قبل التطبيق.') : null,
      (P.inputWarnings.length || p.warnings.length) ? notice('warn', 'تنبيهات', [...P.inputWarnings, ...p.warnings]) : null,
      h('h3', {}, 'الجدول الزمني التقديري'),
      h('div', { class: 'kpis' },
        kpi(gain ? 'المطلوب زيادته' : 'المطلوب خسارته', num(gain ? tl.weightToGain : tl.weightToLose, 1), 'كجم'),
        kpi('المدة', num(tl.estimatedWeeks, 1), 'أسبوع', `≈ ${tl.calendarMonths} شهر و${tl.remainderDays} يوم`),
        kpi('الموعد التقريبي', dateAr(tl.completionDate), '', `بمعدل ${p.effectiveRateKg} كجم/أسبوع`)),
      h('p', { class: 'small muted' }, tl.note),
      p.targetDateCheck ? targetDateBlock(p.targetDateCheck) : null,
      h('h3', {}, 'الطاقة والماكروز المبدئية'),
      nutritionTable(n.trainingDay, n.restDay),
      h('p', { class: 'small muted' }, `${energyLine(n)} · ${gain ? `الفائض ${fmt(n.dailySurplus, 0)} سعرة/يوم (${fmt(n.surplusPctOfTdee)}%)` : `العجز ${fmt(n.dailyDeficit, 0)} سعرة/يوم (${fmt(n.deficitPctOfTdee)}%)`} · ${n.note}`),
    ];
  }

  function targetDateBlock(c) {
    if (c.feasible) return notice('good', `تاريخك المستهدف ممكن بمعدل ${c.requiredRateKg} كجم/أسبوع ضمن النطاق الآمن.`);
    return h('div', { class: 'notice warn' }, h('strong', {}, 'التاريخ المستهدف غير واقعي بأمان'), h('p', {}, c.message),
      c.alternatives ? h('ul', {}, c.alternatives.map((a) => h('li', {}, `${a.label} (${a.rateKg} كجم/أسبوع): ${dateAr(a.completionDate)}`))) : null,
      c.interimTargetWeight ? h('p', {}, `هدف مرحلي واقعي حتى تاريخك: نحو ${c.interimTargetWeight} كجم.`) : null);
  }

  async function saveGoal() {
    try {
      S.st = await api('POST', '/api/goal', payload());
      S.wizard = null; toast('تم حفظ الخطة'); go('dashboard');
    } catch (e) {
      S.wizard.errors = e.data?.errors || {}; S.wizard.previewError = Object.values(S.wizard.errors)[0] || 'تعذر الحفظ.'; renderWizard();
    }
  }

  // ---------- shared blocks ----------
  function kpi(label, value, unit, hint) {
    return h('div', { class: 'kpi' }, h('div', { class: 'label' }, label), h('div', { class: 'value' }, value, unit ? h('small', {}, ' ', unit) : null), hint ? h('div', { class: 'hint' }, hint) : null);
  }
  function nutritionTable(tr, rest) {
    const row = (d, l) => d && h('tr', {}, h('th', {}, l), ...[d.kcal, d.proteinG, d.carbG, d.fatG, d.fiberG].map((v) => h('td', { class: 'n' }, String(v))));
    return h('div', { class: 'table-wrap' }, h('table', {},
      h('thead', {}, h('tr', {}, h('th', {}, ''), ...['سعرات', 'بروتين جم', 'كارب جم', 'دهون جم', 'ألياف جم'].map((x) => h('th', { class: 'n' }, x)))),
      h('tbody', {}, row(tr, 'يوم تدريب'), row(rest, 'يوم راحة'))),
      // macro detail (audit 2026-10-22, F5): g/kg, % of energy and the 4/4/9 check against the calorie target
      [[tr, 'يوم تدريب'], [rest, 'يوم راحة']].filter(([d]) => d && d.macroKcal != null).map(([d, l]) => h('p', { class: 'small muted' },
        `${l}: بروتين ${d.proteinGPerKg} جم/كجم (${d.proteinPctKcal}%) · كارب ${d.carbGPerKg} جم/كجم (${d.carbPctKcal}%) · دهون ${d.fatGPerKg} جم/كجم (${d.fatPctKcal}%) · طاقة الماكروز (4/4/9) ${d.macroKcal} سعرة${d.macroGapKcal ? `، الفرق عن الهدف ${d.macroGapKcal > 0 ? '+' : ''}${d.macroGapKcal} من تقريب الجرامات` : ''}.`)));
  }
  function energyLine(n) {
    const r = n.needs.tdeeRange;
    return `معدل الأيض أثناء الراحة ${n.needs.bmrKey === 'measured' ? 'المقاس' : 'المتوقع (معادلة، مش قياس)'} ${fmt(n.needs.bmr, 0)} سعرة (${n.needs.bmrEquation}) · الاحتياج اليومي المقدّر ${fmt(n.needs.tdeeAvg, 0)} سعرة${r ? ` (سيناريو ${fmt(r.low, 0)}–${fmt(r.high, 0)})` : ''}`;
  }
  function currentWeek() { return Math.max(0, Math.floor((Date.parse(S.meta.today) - Date.parse(S.st.goal.startDate)) / (7 * 86400000))); }

  // ---------- dashboard ----------
  function renderDashboard() {
    const st = S.st, g = st.goal, tl = st.timeline, ev = st.evaluation;
    const lastRow = [...st.rows].reverse().find((r) => r.avgWeight != null);
    const progress = lastRow ? lastRow.goalProgressPct : 0;
    const bar = h('span', {}); bar.style.width = `${Math.max(0, Math.min(100, progress))}%`;
    const quickW = h('input', { type: 'number', step: '0.1', inputmode: 'decimal', placeholder: 'وزن اليوم (كجم)', 'aria-label': 'وزن اليوم بالكيلوجرام' });
    append(
      h('h1', {}, isGainGoal(g.input && g.input.primaryGoal) ? 'هدفي في زيادة الوزن' : t('goal.title')),
      S.sub && S.sub.daysLeft != null && S.sub.daysLeft <= 5 ? notice('warn', `${S.sub.state === 'trial' ? 'الفترة التجريبية' : 'اشتراكك'} بيخلص بعد ${S.sub.daysLeft} ${S.sub.daysLeft === 1 ? 'يوم' : 'أيام'} (${dateAr(S.sub.endsOn)}). بعدها الأدوات بتتقفل لحد التجديد.`) : null,
      holdBanner(st.hold),
      waiverNotice(st.hold),
      inboxCard(),
      st.plan.requiresProfessional ? notice('bad', 'هذه الخطة تحتاج مراجعة أخصائي تغذية رياضية أو طبيب.') : null,
      st.planReview && st.planReview.state !== 'none' ? notice(st.planReview.state === 'current' && st.planReview.decision === 'approved' ? 'good' : 'warn', st.planReview.text, st.planReview.note ? [`ملاحظة الأخصائي: ${st.planReview.note}`] : undefined) : null,
      h('div', { class: 'kpis' },
        kpi('الوزن الابتدائي', num(g.startWeight), 'كجم'),
        kpi('متوسط الوزن الحالي', num(tl.currentWeight, 2), 'كجم', lastRow ? `الأسبوع ${lastRow.week + 1}` : 'لا قياسات بعد'),
        kpi('الوزن المستهدف', num(g.targetWeight), 'كجم'),
        kpi('المعدل المخطط', num(g.weeklyRateKg, 2), 'كجم/أسبوع'),
        kpi('الموعد المتوقع', dateAr(tl.projection.completionDate), '', 'تقدير وليس وعدًا'),
        kpi('تحقيق الهدف', num(progress, 0), '%')),
      h('div', { class: 'card' }, h('div', { class: 'spread' }, h('strong', {}, 'التقدم نحو الهدف'), h('span', { class: 'muted small' }, `${fmt(progress, 0)}%`)),
        h('div', { class: 'bar' }, bar), h('p', { class: 'small muted' }, tl.projection.reason),
        tl.projection.changeText ? notice('info', tl.projection.changeText) : null),
      h('form', { class: 'card', onsubmit: async (e) => {
        e.preventDefault();
        try { S.st = await api('POST', '/api/weights', { date: S.meta.today, weightKg: quickW.value }); toast('تم تسجيل الوزن'); go('dashboard'); }
        catch (ex) { toast(Object.values(ex.data?.errors || {})[0] || 'تعذر الحفظ'); }
      } }, h('h2', {}, 'وزن اليوم'), h('p', { class: 'small muted' }, 'سجّل وزنك عدة مرات أسبوعيًا في ظروف متشابهة؛ نعتمد على المتوسط الأسبوعي لا على قراءة يوم واحد.'),
        h('div', { class: 'row' }, quickW, h('button', { class: 'primary', type: 'submit' }, 'تسجيل'))),
      h('div', { class: 'card' }, h('div', { class: 'spread' }, h('h2', {}, 'تقييم هذا الأسبوع'), h('span', { class: 'badge' }, t(`action.${ev.action}`))),
        h('ul', {}, ev.reasons.map((r) => h('li', {}, r))),
        ev.trend ? h('p', { class: 'small muted' }, `الاتجاه على ${ev.trend.weeksUsed} أسابيع: `, num(ev.observedLossKg, 2), ' كجم/أسبوع مقابل ', num(ev.targetRateKg, 2), ' مخطط') : null,
        st.pending ? notice('warn', 'يوجد اقتراح تعديل بانتظار قرارك في صفحة التغذية.') : null,
        h('div', { class: 'actions' }, h('button', { type: 'button', onclick: () => go('nutrition') }, 'التغذية والتعديلات'), h('button', { type: 'button', onclick: () => go('weekly') }, 'المتابعة الأسبوعية'))),
      st.recalcSuggested ? h('div', { class: 'notice info' }, h('strong', {}, 'تغير وزنك بوضوح منذ حساب الاحتياجات.'),
        h('p', {}, 'يُنصح بإعادة حساب الاحتياجات على متوسط وزنك الحالي.'),
        h('button', { type: 'button', class: 'primary', onclick: recalc }, 'أعد حساب الاحتياجات')) : null,
    );
  }
  async function recalc() {
    try { S.st = await api('POST', '/api/goal/recalculate'); toast('أعيد حساب الاحتياجات'); go('nutrition'); }
    catch (e) { toast('تعذر إعادة الحساب'); }
  }

  // ---------- weekly ----------

    return S.wp;

  // Display only (same table as weekplan.sleepAdvice — kealy2023): sleep hours and the age recommendation. Never blocks.
  function sleepLine(p) {
    const tm = (x) => { const [a, b] = x.split(':').map(Number); return a * 60 + b; };
    const awake = (tm(p.sleepTime) - tm(p.wakeTime) + 1440) % 1440;
    const hrs = Math.round(((1440 - awake) / 60) * 10) / 10;
    const age = S.st?.goal?.input?.age;
    const rec = age == null ? null : age < 13 ? [9, 12] : age <= 18 ? [8, 10] : age <= 60 ? [7, null] : age <= 64 ? [7, 9] : [7, 8];
    const low = (rec && hrs < rec[0]) || hrs < 8;
    return h('p', { class: low ? 'small warn-text' : 'small muted' }, `نومك ${hrs} ساعة`,
      rec ? ` · الموصى بيه لسنك ${rec[1] ? `${rec[0]}–${rec[1]}` : `${rec[0]}+`} ساعات` : '',
      hrs < 8 ? ' · أقل من 8 ساعات بيزود خطر الإصابة عند الرياضيين.' : '');
  }

      const err = (k) => errors[k] ? h('div', { class: 'field-error' }, errors[k]) : null;
      const timeIn = (val, set, label, id) => h('input', { type: 'time', id, value: val, 'aria-label': label, onchange: (e) => set(e.target.value) });
      const check = (val, set, label) => h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: val, onchange: (e) => { set(e.target.checked); draw(); } }), label);

          WEEK.map((d) => {
            const list = p.schedule[d] || [];
            return h('div', { class: 'sched-row' }, h('span', { class: 'pref-name' }, O.days[d]),
              h('div', { class: 'times' },
                list.map((s, j) => h('span', { class: 'time-item' },
                  timeIn(s.start, (v) => { s.start = v; }, `ميعاد حصة ${j + 1} يوم ${O.days[d]}`),
                  h('select', { 'aria-label': 'مدة الحصة', onchange: (e) => { s.duration = Number(e.target.value); } },

                    const [hh, mm] = nl[0].start.split(':').map(Number);
                    const s0 = hh * 60 + mm;
                    let t = s0 + nl[0].duration + 240;
                    if (t > 21 * 60) t = Math.max(5 * 60, s0 - DUR - 240);

  // Ingredients are shown per serving; the stepper scales to any number of servings.
  function recipeView(r) {
    const p = r.perServing;

    const time = [r.prepMin && `تحضير ${r.prepMin} د`, r.cookMin && `طهي ${r.cookMin} د`, r.ovenC && `فرن ${r.ovenC}°م`].filter(Boolean).join(' · ');
    const body = h('div', { class: 'recipe-body' });
    let n = 1;
    const g = (grams) => { const v = (grams / r.servings) * n; return v >= 10 ? Math.round(v) : Math.round(v * 2) / 2; };
    const drawBody = () => {
      body.innerHTML = '';
      const tot = { kcal: p.kcal * n, protein: p.protein * n, carb: p.carb * n, fat: p.fat * n, fiber: p.fiber * n };
      body.append(...[
        h('div', { class: 'item-tags' }, time ? h('span', { class: 'small muted' }, time) : null,
          r.estimate ? h('span', { class: 'badge warn' }, 'قيم تقديرية غير مراجعة') : null,
          r.plan.fasting === 'vegan' ? h('span', { class: 'badge' }, 'صيامي') : r.plan.fasting === 'fish' ? h('span', { class: 'badge' }, 'صيامي بالسمك') : null,
          r.plan.ironRich ? h('span', { class: 'badge good' }, 'غني بالحديد') : null, r.plan.vitDRich ? h('span', { class: 'badge good' }, 'فيتامين د') : null),
        h('div', { class: 'stepper' }, h('span', {}, 'عدد الحصص'),
          h('button', { type: 'button', class: 'small-btn', 'aria-label': 'قلل الحصص', disabled: n <= 1 || null, onclick: () => { n = Math.max(1, n - 1); drawBody(); } }, '−'),
          h('strong', { 'aria-live': 'polite' }, String(n)),
          h('button', { type: 'button', class: 'small-btn', 'aria-label': 'زوّد الحصص', disabled: n >= 12 || null, onclick: () => { n = Math.min(12, n + 1); drawBody(); } }, '+'),
          n !== r.servings ? h('button', { type: 'button', class: 'ghost small-btn', onclick: () => { n = r.servings; drawBody(); } }, `الوصفة كاملة (${r.servings})`) : null),
        h('h3', {}, n === 1 ? 'المكونات للحصة الواحدة' : `المكونات لـ ${n} حصص`),
        h('ul', { class: 'ingredients' }, r.items.filter((i) => i.foodId !== 'salt').map((i) => h('li', {}, h('strong', {}, `${g(i.grams)} جم`), ' ', i.ar, ' ',
          h('span', { class: 'badge' }, stateAr[i.state] || i.state), i.trust === 'proxy' ? h('span', { class: 'badge warn', title: i.source }, 'بديل تقريبي') : null))),
        r.oilG ? h('p', { class: 'small muted' }, `الزيت/الدهون المضافة: ${g(r.oilG)} جم`) : null,
        r.steps.length ? [h('h3', {}, 'الطريقة'), h('ol', { class: 'steps-list' }, r.steps.map((s) => h('li', {}, s)))] : (r.method ? h('p', {}, r.method) : null),
        r.servings !== n && r.steps.length ? h('p', { class: 'small muted' }, `الخطوات مكتوبة للوصفة كاملة (${r.servings} ${r.servings === 1 ? 'حصة' : 'حصص'})؛ استخدم الكميات اللي فوق بنفس الطريقة، ووقت الطهي ممكن يقل مع الكمية الصغيرة.`) : null,
        r.tips.length ? h('ul', { class: 'small muted' }, r.tips.map((t) => h('li', {}, t))) : null,
        h('div', { class: 'table-wrap' }, h('table', {},
          h('thead', {}, h('tr', {}, h('th', {}, ''), ...['سعرات', 'بروتين', 'كارب', 'دهون', 'ألياف'].map((x) => h('th', { class: 'n' }, x)))),
          h('tbody', {},
            h('tr', {}, h('th', {}, 'الحصة'), ...[p.kcal, p.protein, p.carb, p.fat, p.fiber].map((v) => h('td', { class: 'n' }, String(v)))),
            n > 1 ? h('tr', {}, h('th', {}, `${n} حصص`), ...[tot.kcal, tot.protein, tot.carb, tot.fat, tot.fiber].map((v) => h('td', { class: 'n' }, String(Math.round(v))))) : null))),
      ].flat(Infinity).filter(Boolean));

    const d = h('details', { class: 'recipe', ontoggle: () => { if (d.open && !body.childNodes.length) drawBody(); } },

  // Download the nutrition file as a real .pdf: from the server (Chromium) when it is set up, otherwise built
  // in the browser (public/pdfexport.js). The demo supplies the page and the save step through window hooks.
  async function downloadNutritionPdf(btn) {
    const name = `eklni-nutrition-${S.meta.today}.pdf`;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'بنجهّز الملف…';
    try {
      let bytes;
      if (S.meta.pdfDownload) {
        const res = await fetch('/api/nutrition-file.pdf', { credentials: 'same-origin' });
        if (res.status === 402) { renderLocked(await res.json()); return; }
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || '');
        bytes = new Uint8Array(await res.arrayBuffer());
      } else {
        if (!window.EklniPdf) throw new Error('');
        const html = window.__eklniNutritionHtml ? window.__eklniNutritionHtml() : undefined;
        if (html === null) throw new Error('اعمل خطة الأسبوع الأول.');
        bytes = (await window.EklniPdf.nutritionPdf(html ? { html } : { url: '/api/nutrition-file' })).bytes;
      }
      const r = await saveFile(name, bytes, 'application/pdf');
      toast(r === 'saved' ? 'اتحفظ ملف التغذية PDF' : r === 'declined' ? 'اتلغى التنزيل' : 'لو التنزيل ما بدأش، افتح الصفحة في متصفح (Chrome) وجرّب تاني.');
    } catch (e) {
      const code = e && e.code ? ` (${e.code})` : '';
      toast(e && e.message && !e.code ? e.message : `تعذر عمل الملف على الجهاز ده${code}؛ ابعتلنا الكود ده، واستخدم «عرض / طباعة» مؤقتًا.`);
    } finally { btn.disabled = false; btn.textContent = label; }
  }
  window.__eklniDownloadPdf = downloadNutritionPdf;
  async function saveFile(name, bytes, type) {
    if (window.__eklniSaveFile) return window.__eklniSaveFile(name, bytes);
    const url = URL.createObjectURL(new Blob([bytes], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return 'saved';
  }
