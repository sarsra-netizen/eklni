plugins {
    id "com.android.application"
}

// versionCode/versionName come from the workflow (GitHub run number / package.json); defaults for local builds.
def vCode = (System.getenv("EKLNI_VERSION_CODE") ?: "1").toInteger()
def vName = System.getenv("EKLNI_VERSION_NAME") ?: "0.7.1"

android {
    namespace "app.eklni.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "app.eklni.mobile"
        minSdk 24
        targetSdk 35
        versionCode vCode
        versionName vName
    }

    // Release signing only when the keystore secrets exist (see MOBILE.md). Without them only the debug APK is built.
    def ks = System.getenv("EKLNI_KEYSTORE_FILE")
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("EKLNI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("EKLNI_KEY_ALIAS")
                keyPassword System.getenv("EKLNI_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"     // FileProvider + window insets
    implementation "androidx.webkit:webkit:1.12.1" // WebViewAssetLoader (https origin for the bundled page)
}
